packages:
  - 'packages/*'
  - 'examples/*'

# esbuild (used by tsup and vite) needs its postinstall to fetch the native
# binary; pnpm blocks dependency build scripts by default.
allowBuilds:
  esbuild: true

# Peer dependencies: install missing ones, and fail on conflicts instead of
# warning. (Kept here rather than in .npmrc, which npm also reads and warns
# about.)
autoInstallPeers: true
strictPeerDependencies: true
