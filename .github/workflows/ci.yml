name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Size budgets
        run: pnpm size

      - name: Unit tests
        run: pnpm test

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e
        # GitHub's shared runners are ~1ms noisier than the §13 base budget at
        # 10k events (measured 16–17.5ms vs the 16ms gate), so the strict gate
        # flakes here while passing locally. perf.spec.ts exposes PERF_TOLERANCE_MS
        # for exactly this: widen the CI gate enough to absorb runner variance
        # while still catching real regressions (a true regression is many ms).
        # Local runs keep the strict 16ms budget (no tolerance).
        env:
          PERF_TOLERANCE_MS: '4'
