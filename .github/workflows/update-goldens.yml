name: Update golden screenshots

# Regenerates the Linux golden baselines (examples/demo/tests/
# golden.spec.ts-snapshots) on the same runner image CI compares them on,
# after an intentional rendering change. The new images are uploaded as an
# artifact for review; commit them to the branch to accept them.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Render new baselines
        run: pnpm exec playwright test --project golden --update-snapshots

      - name: Upload baselines
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-snapshots
          path: examples/demo/tests/golden.spec.ts-snapshots/
