name: Release

# Publishes the packages via Changesets (DESIGN.md §15, Phase 8) using npm
# **Trusted Publishing (OIDC)** — no long-lived NPM_TOKEN. On a push to main the
# Changesets action opens/updates a "Version Packages" PR that applies pending
# changesets; merging that PR re-runs this workflow with no changesets left, so
# the publish step runs and uploads to npm via a short-lived OIDC credential.
#
# Requirements (see https://docs.npmjs.com/trusted-publishers/):
#   - `id-token: write` permission (below) so GitHub can mint the OIDC token.
#   - npm CLI >= 11.5.1 and Node >= 22.14.0 (we upgrade npm explicitly).
#   - A Trusted Publisher configured on npmjs.com for each package (owner
#     KarlGorgoglione, repo event-timeline, workflow release.yml).
#   - NO npm auth token anywhere (an empty/real token in the env or .npmrc makes
#     npm try the token instead of OIDC), so we deliberately set none.
#
# We publish with `npm publish` rather than `changeset publish`: changesets shells
# out to the detected package manager (pnpm here), and pnpm 11.x has an open OIDC
# publish bug (pnpm/pnpm#11513, fix #11526 unreleased). npm's OIDC path is solid,
# so Changesets handles only versioning and we do the upload with npm directly.
# The tarball is built with `pnpm pack` first, though: only pnpm rewrites
# `workspace:` dependency ranges to real semver versions, and npm would upload
# the manifest verbatim — making the package uninstallable outside pnpm.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships npm 10.x.
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@latest

      # When changesets are pending this opens/updates the "Version Packages" PR
      # (and does not publish). When none are pending — i.e. that PR was just
      # merged — it does nothing and the publish step below runs.
      - name: Create Version Packages PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish any package whose version isn't on npm yet, via OIDC (no token).
      # Provenance is attested from this workflow's OIDC identity. Idempotent:
      # already-published versions are skipped, so re-runs are safe. For each
      # freshly published version we also create a matching GitHub Release, with
      # notes lifted from that version's CHANGELOG.md section (the tags are
      # lightweight, so --notes-from-tag isn't an option). GH_TOKEN uses the
      # built-in GITHUB_TOKEN (the job already has contents: write).
      - name: Publish to npm (OIDC trusted publishing)
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm --filter "./packages/*" run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          published=0
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            private=$(node -p "require('./${dir}package.json').private === true")
            if [ "$private" = "true" ]; then continue; fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published — skipping"
              continue
            fi
            echo "Publishing $name@$version"
            # Pack with pnpm so `workspace:` dependency ranges are rewritten to
            # real semver versions in the tarball manifest (raw `npm publish`
            # uploads them verbatim, breaking installs from npm/yarn/bun), then
            # upload with npm so OIDC trusted publishing still applies.
            tarball=$( cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n 1 )
            npm publish "$tarball" --provenance --access public
            tag="$name@$version"
            git tag "$tag"
            git push origin "refs/tags/$tag"
            # Extract this version's section from the package CHANGELOG: the lines
            # between "## <version>" and the next "## " heading.
            notes=$(awk -v ver="## $version" '
              $0 == ver { f = 1; next }
              f && /^## / { exit }
              f { print }
            ' "${dir}CHANGELOG.md")
            gh release create "$tag" \
              --title "$tag" \
              --notes "${notes:-$tag}"
            published=1
          done
