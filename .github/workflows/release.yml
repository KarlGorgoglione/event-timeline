name: Release

# Publishes the packages via Changesets (DESIGN.md §15, Phase 8). On a push to
# main, the Changesets action opens/updates a "Version Packages" PR that applies
# pending changesets; merging that PR re-runs this workflow, which then publishes
# to npm. Requires repo secret NPM_TOKEN with publish rights to the
# @event-timeline scope (which must exist on npm before the first release).
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Authenticate npm for publishing. `changeset publish` shells out to
      # `npm publish`, which only reads a token from an .npmrc — passing
      # NPM_TOKEN as an env var alone does nothing. We write the resolved token
      # into the runner's user-level .npmrc *after* install (so the install step
      # is unaffected) rather than committing a token reference into the repo
      # .npmrc, keeping local dev auth-free.
      - name: Configure npm authentication
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publishing requires a token that bypasses 2FA (account/org enforces 2FA
      # for writes): use a classic *Automation* token or a granular token with
      # "Packages and scopes: Read and write" for @event-timeline as NPM_TOKEN.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
